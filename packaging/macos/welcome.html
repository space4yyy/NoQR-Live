<h1>OBS QR Shield 二维码自动遮挡</h1>
<p>为 OBS 添加二维码自动检测、黑块、高斯模糊（Blur）及自定义图片遮挡。</p>
<p>适用于 Apple 芯片 Mac、macOS 13 或更高、OBS 32。请先把 OBS.app 放到“应用程序”文件夹，并退出 OBS，再继续安装。</p>
<p>插件只安装到当前用户的 OBS 插件目录，无需手动查找文件夹。</p>
<p>此版本未经过 Developer ID 签名和 Apple 公证。通过互联网分享时，macOS 可能要求安全确认。</p>
</html>
