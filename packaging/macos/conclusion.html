<h2>下一步</h2>
<ol><li>重新打开 OBS。</li><li>右键采集卡来源 → 滤镜 → 效果滤镜 → ＋。</li><li>添加“二维码自动遮挡 / QR Shield”。</li><li>在“遮挡方式”中选择黑块、高斯模糊 / Blur 或自定义图片。</li></ol>
<p>Blur 强度最低 60，默认 80。请使用 SDR，并先录制测试。检测及模糊不能保证所有二维码都不会被识别。</p>
<p>无需重启 Mac。</p></html>
