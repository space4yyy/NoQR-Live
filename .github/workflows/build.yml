name: Build OBS plugin

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: macOS arm64
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Obtain the official OBS app
        env:
          OBS_APP: ${{ runner.temp }}/OBS.app
        run: bash scripts/fetch-obs-macos.sh
      - name: Build and package
        env:
          OBS_APP: ${{ runner.temp }}/OBS.app
        run: bash scripts/package-macos.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: OBS-QR-Shield-macOS-arm64
          if-no-files-found: error
          path: |
            build/OBS-QR-Shield-*-macOS-arm64.pkg
            build/OBS-QR-Shield-*-macOS-arm64.dmg
            build/OBS-QR-Shield-*-source.zip
            build/OBS-QR-Shield-*-macOS-arm64-SHA256.txt

  windows:
    name: Windows x64
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Build, test and package
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: OBS-QR-Shield-Windows-x64
          if-no-files-found: error
          path: |
            build/windows-x64/OBS-QR-Shield-*-Windows-x64.zip
            build/windows-x64/OBS-QR-Shield-*-Windows-x64.zip.sha256

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: OBS-QR-Shield-*
          merge-multiple: true
          path: release-files
      - name: Verify and publish release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(jq -er '.plugin' config/versions.json)
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            printf 'Tag %s does not match project version v%s\n' "$RELEASE_TAG" "$version" >&2
            exit 1
          fi

          cd release-files
          prefix="OBS-QR-Shield-$version"
          sha256sum -c "$prefix-macOS-arm64-SHA256.txt"
          tr -d '\r' < "$prefix-Windows-x64.zip.sha256" | sha256sum -c -
          assets=(
            "$prefix-macOS-arm64.dmg"
            "$prefix-macOS-arm64.pkg"
            "$prefix-macOS-arm64-SHA256.txt"
            "$prefix-source.zip"
            "$prefix-Windows-x64.zip"
            "$prefix-Windows-x64.zip.sha256"
          )

          draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null || true)
          if [[ "$draft" == false ]]; then
            printf 'Release %s is already published\n' "$RELEASE_TAG"
            exit 0
          fi
          if [[ "$draft" != true ]]; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes --title "OBS QR Shield $RELEASE_TAG"
          fi
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          gh release edit "$RELEASE_TAG" --draft=false
