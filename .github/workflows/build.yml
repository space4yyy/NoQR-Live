name: Build OBS plugin

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: macOS arm64
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Obtain the official OBS app
        env:
          OBS_APP: ${{ runner.temp }}/OBS.app
        run: bash scripts/fetch-obs-macos.sh
      - name: Build and package
        env:
          OBS_APP: ${{ runner.temp }}/OBS.app
        run: bash scripts/package-macos.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: OBS-QR-Shield-macOS-arm64
          if-no-files-found: error
          path: |
            build/OBS-QR-Shield-*-macOS-arm64.pkg
            build/OBS-QR-Shield-*-macOS-arm64.dmg
            build/OBS-QR-Shield-*-source.zip
            build/OBS-QR-Shield-*-macOS-arm64-SHA256.txt

  windows:
    name: Windows x64
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Build, test and package
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: OBS-QR-Shield-Windows-x64
          if-no-files-found: error
          path: |
            build/windows-x64/OBS-QR-Shield-*-Windows-x64.zip
            build/windows-x64/OBS-QR-Shield-*-Windows-x64.zip.sha256
